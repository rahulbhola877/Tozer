<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Read every public-domain writing of A. W. Tozer alongside the Bible, with a built-in dictionary and translator.">
<meta name="theme-color" content="#F1F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Tozer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Young+Serif&display=swap">
<style>
/* Layout: a boxed reading desk. Hard 1px rules, no radius; one column for reading, a sheet for words. */
:root{
  --paper:#F1F1EE; --card:#FBFBF9; --ink:#16171A; --ink2:#2A2C30; --muted:#595B61; --rule:#1E2024; --hair:#D3D3CE;
  --accent:#A11D21; --accent-ink:#FFFFFF; --accent-soft:#F4E1DF; --mark:#F3E3A2; --link:#8E1A1E;
  --display:"Young Serif","Libre Caslon Text",Georgia,"Times New Roman",serif;
  --serif:"Literata","Source Serif 4",Georgia,"Times New Roman",serif;
  --ui:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --rs:1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111214; --card:#18191C; --ink:#EAE8E3; --ink2:#D6D4CF; --muted:#A3A5AA; --rule:#51545A; --hair:#2C2E33;
  --accent:#EF7B70; --accent-ink:#141416; --accent-soft:#3A1F1E; --mark:#5B4C17; --link:#F29A90; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111214; --card:#18191C; --ink:#EAE8E3; --ink2:#D6D4CF; --muted:#A3A5AA; --rule:#51545A; --hair:#2C2E33;
  --accent:#EF7B70; --accent-ink:#141416; --accent-soft:#3A1F1E; --mark:#5B4C17; --link:#F29A90; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:18px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--link)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;flex:none}
.brand h1{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;letter-spacing:0}
.brand small{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;letter-spacing:.01em}
.hbtn{border:1px solid var(--rule);background:var(--card);min-height:40px;padding:0 12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
.hbtn:hover{background:var(--accent-soft)}
.tdot{width:12px;height:12px;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--rule);background:var(--card)}
.tab{border:0;border-right:1px solid var(--hair);background:transparent;padding:10px 4px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink2);min-height:48px}
.tab:last-child{border-right:0}
.tab svg{width:19px;height:19px;flex:none}
.tab:hover{background:var(--paper)}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent);background:var(--accent-soft)}

/* boxes */
.box{border:1px solid var(--rule);background:var(--card)}
.pad{padding:18px 20px}
.box>*+*{border-top:1px solid var(--hair)}
.label{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.label.red{color:var(--accent)}
.pageh{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;text-wrap:balance}
.lede{font-family:var(--serif);font-size:17px;line-height:1.55;color:var(--ink2)}
.note{font-size:13.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{border:1px solid var(--rule);background:var(--card);min-height:42px;padding:8px 16px;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.link{border:0;background:transparent;padding:4px 0;min-height:0;color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=search],select,textarea{border:1px solid var(--rule);background:var(--paper);padding:10px 12px;min-height:44px;width:100%;border-radius:0}
textarea{min-height:96px;resize:vertical;font-family:var(--serif);font-size:16px;line-height:1.5}
select{width:auto;min-width:0}
.ctl{display:flex;gap:8px}
.ctl input{flex:1;min-width:0}

/* list rows */
.lrow{width:100%;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:15px 20px}
.lrow:hover{background:var(--paper)}
.lrow b{display:block;font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.3}
.lrow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.lrow .go{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.lrow .desc{display:block;font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.45}
.yr{border:0;background:transparent;width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 20px;font-weight:600;font-size:15px}
.yr:hover{background:var(--paper)}
.yr span{color:var(--muted);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.erow{width:100%;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 20px;font-size:15px;align-items:baseline}
.erow:hover{background:var(--paper)}
.erow time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.erow b{font-family:var(--serif);font-weight:400;font-size:16.5px}
.erow.read b{color:var(--muted)}

/* hero (today) */
.hero .kicker{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hero h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin-top:10px;text-wrap:balance}
.hero .ex{font-family:var(--serif);font-size:19px;line-height:1.6;margin-top:14px;color:var(--ink2)}
.wod b{font-family:var(--display);font-weight:400;font-size:26px}
.wod .pos{font-style:italic;color:var(--muted);font-family:var(--serif)}

/* reader */
.rbar{display:flex;border:1px solid var(--rule);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.rbar>button,.rbar>div{border:0;border-right:1px solid var(--hair);background:transparent;min-height:50px;padding:0 14px;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:center}
.rbar>:last-child{border-right:0}
.rbar>button:hover{background:var(--paper)}
.rbar .rt{flex:1;min-width:0;justify-content:flex-start;text-transform:none;letter-spacing:0;font-size:15px;font-weight:600}
.rbar .rt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .ic{width:50px;padding:0;font-size:18px}
.doc{padding:30px 34px 34px}
.doc .dlabel{margin-bottom:8px}
.doc h2{font-family:var(--display);font-weight:400;font-size:calc(29px * var(--rs));line-height:1.18;margin-bottom:22px;text-wrap:balance}
.doc p{font-family:var(--serif);font-size:calc(18.5px * var(--rs));line-height:1.7;margin:0 0 1.05em;hanging-punctuation:first}
.doc p.q{font-style:italic;color:var(--ink2);padding-left:1.1em;border-left:3px solid var(--accent);white-space:pre-line}
.doc p.kept{background:var(--mark);box-shadow:0 0 0 6px var(--mark)}
.doc .sref{color:var(--link);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
.doc .src{margin-top:24px;padding-top:14px;border-top:1px solid var(--hair);font-size:13px;color:var(--muted)}
.vs .v{cursor:text}
.vs .vn{font-family:var(--ui);font-size:.55em;font-weight:600;color:var(--accent);position:relative;top:-.55em;margin-right:3px}
.vs .it{font-style:italic}
.vs p.poet{padding-left:1.2em;text-indent:-1.2em}
.toc{width:100%;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:34px 1fr;gap:8px;padding:12px 20px;font-family:var(--serif);font-size:16.5px}
.toc:hover{background:var(--paper)}
.toc i{font-style:normal;color:var(--muted);font-family:var(--ui);font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:3px}
.toc.cur{background:var(--accent-soft)}
.sechead{padding:12px 20px 6px}
.pager{display:grid;grid-template-columns:1fr 1fr}
.pager button{border:0;background:transparent;padding:16px 20px;text-align:left;min-height:64px}
.pager button+button{border-left:1px solid var(--hair);text-align:right}
.pager button:hover{background:var(--paper)}
.pager small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.pager span{font-family:var(--serif);font-size:16px}
::highlight(tzword){background:var(--mark);color:inherit}

/* bible */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule)}
.seg button{border:0;background:var(--card);min-height:42px;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid button{border:0;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);background:transparent;padding:11px 14px;text-align:left;font-size:14.5px;min-height:44px}
.grid button:hover{background:var(--paper)}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.chs button{border:0;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);background:transparent;min-height:48px;font-variant-numeric:tabular-nums;font-size:15px}
.chs button:hover{background:var(--accent-soft)}

/* search */
.hit{width:100%;border:0;background:transparent;text-align:left;padding:14px 20px;display:block}
.hit:hover{background:var(--paper)}
.hit small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hit span{display:block;font-family:var(--serif);font-size:16px;line-height:1.5;margin-top:4px}
.hit mark{background:var(--mark);color:inherit}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.35);z-index:40}
.sheet{position:fixed;z-index:41;background:var(--card);border:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:900px){.sheet{top:16px;right:16px;bottom:16px;width:420px}}
@media (max-width:899px){.sheet{left:0;right:0;bottom:0;max-height:82vh;border-width:1px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.shead h3{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;word-break:break-word}
.shead .x{border:1px solid var(--rule);background:var(--card);width:42px;height:42px;font-size:20px;flex:none}
.sbody{overflow:auto;-webkit-overflow-scrolling:touch}
.sbody>section{padding:16px 20px;border-bottom:1px solid var(--hair)}
.sbody>section:last-child{border-bottom:0}
.sense{margin-top:10px;display:grid;grid-template-columns:24px 1fr;gap:6px;font-family:var(--serif);font-size:16px;line-height:1.5}
.sense i{font-style:normal;font-family:var(--ui);font-size:12px;color:var(--muted);padding-top:3px}
.sense em{color:var(--muted)}
.syn{font-size:13px;color:var(--muted);margin-top:2px;font-family:var(--ui)}
.long{font-family:var(--serif);font-size:15.5px;line-height:1.55;margin-top:8px;color:var(--ink2)}
.tr{font-family:var(--serif);font-size:18px;line-height:1.55;margin-top:10px;padding:12px 14px;background:var(--paper);border:1px solid var(--hair);white-space:pre-wrap}
.tr.big{font-size:16.5px}
.verse{font-family:var(--serif);font-size:17px;line-height:1.6;margin-top:8px}
.verse b{font-family:var(--ui);font-size:11px;color:var(--accent);margin-right:4px;vertical-align:.4em}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--card);padding:7px 11px;font-size:14px;font-family:var(--serif)}
.chip:hover{background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:22px 20px;color:var(--muted);font-size:14.5px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--hair);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.foot{font-size:12.5px;color:var(--muted);line-height:1.6;padding:4px 2px}
.foot a{color:var(--muted)}

/* phones */
@media (max-width:699px){
  body{padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}
  .brand h1{font-size:28px}
  .brand small{display:none}
  .logo{width:34px;height:34px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border-width:1px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab{flex-direction:column;gap:3px;font-size:11.5px;padding:8px 0 7px;min-height:58px}
  .tab svg{width:21px;height:21px}
  .tab[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--accent)}
  .pad{padding:16px 18px}
  .doc{padding:24px 20px 26px}
  .doc h2{font-size:calc(25px * var(--rs))}
  .doc p{font-size:calc(17.5px * var(--rs));line-height:1.64;text-align:justify;text-align-last:left;hyphens:auto;-webkit-hyphens:auto;text-wrap:pretty}
  .doc p.q,.vs p.poet{text-align:left}
  .hero h2{font-size:25px}
  .hero .ex{font-size:17.5px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
  .pageh{font-size:24px}
  .rbar .ic{width:44px}
  .rbar>button,.rbar>div{padding:0 10px}
  .erow{grid-template-columns:78px 1fr;padding:10px 18px}
  .lrow,.yr,.toc,.hit{padding-inline:18px}
}
.tip{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border:1px solid var(--rule);background:var(--accent-soft);padding:12px 14px;font-size:14px;line-height:1.45}
.tip button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;min-height:32px;padding:0 4px;text-decoration:underline;text-underline-offset:4px;flex:none}
.prog{height:3px;background:var(--hair)}
.prog i{display:block;height:100%;background:var(--accent)}
.doc p{-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
</style>
</head>
<body>


<div class="wrap" lang="en">
  <header class="head">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="var(--accent)"/><path d="M11 14H53V30H47V21H37V45H43V50H21V45H27V21H17V30H11Z" fill="var(--accent-ink)"/></svg>
      <div><h1>Tozer</h1><small>Public-domain writings, Bible and dictionary</small></div>
    </div>
    <button class="hbtn" id="themeBtn" aria-label="Colour theme"><span class="tdot" aria-hidden="true"></span><span id="themeLbl">Auto</span></button>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-v="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="16" height="16"/><path d="M4 9h16M9 4v5"/></svg><span>Today</span></button>
    <button class="tab" role="tab" data-v="library" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="5" height="16"/><rect x="10" y="4" width="5" height="16"/><path d="M16.5 5.5l3.8 1-3.6 13.6-3.8-1"/></svg><span>Library</span></button>
    <button class="tab" role="tab" data-v="bible" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 6c-2-1.6-5-2-8-1.6V19c3-.4 6 0 8 1.6 2-1.6 5-2 8-1.6V4.4C17 4 14 4.4 12 6Z"/><path d="M12 6v14.6"/></svg><span>Bible</span></button>
    <button class="tab" role="tab" data-v="search" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="11" height="11"/><path d="M14 14l6 6"/></svg><span>Search</span></button>
    <button class="tab" role="tab" data-v="words" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 19 10 5h1l5 14M7 14h7"/><path d="M17 5h4M19 5v4"/></svg><span>Words</span></button>
  </nav>
  <main id="view" class="stack" tabindex="-1"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div id="sheetRoot"></div>

<script>
"use strict";
/* ============ basics ============ */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const L = {
  get(k, d) { try { const v = localStorage.getItem("tz-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tz-" + k, JSON.stringify(v)); } catch (e) {} },
};
const cache = new Map();
function getJSON(p) {
  if (!cache.has(p)) cache.set(p, fetch(p).then((r) => { if (!r.ok) throw new Error(p + " " + r.status); return r.json(); }).catch((e) => { cache.delete(p); throw e; }));
  return cache.get(p);
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtDate = (d) => { const [y, m, dd] = d.split("-").map(Number); return `${dd} ${MONTHS[m - 1]} ${y}`; };
const shortDate = (d) => { const [, m, dd] = d.split("-").map(Number); return `${dd} ${MONTHS[m - 1].slice(0, 3)}`; };
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied"); } catch (e) { toast("Copy isn't allowed here. Select the text instead."); } }

/* optional Claude (only inside a Claude artifact that grants it) */
let SAMPLE = null;
(async () => { try { if (window.claude && window.claude.use) SAMPLE = await window.claude.use("sample"); } catch (e) { SAMPLE = null; } })();

/* ============ state ============ */
const S = { view: "today", lib: { open: null, year: null, q: "" }, rd: null, bible: { ver: L.get("ver", "kjv"), book: null, ch: null, pick: null }, search: { q: "", scope: "tozer", res: null, busy: false } };
let CAT = null, BOOKS = null;
const bookName = (c, one) => (c === "PSA" && one ? "Psalm" : BOOKS ? (BOOKS.find((b) => b[0] === c) || [c, c])[1] : c);

/* ============ theme + text size ============ */
const THEME_LBL = { auto: "Auto", light: "Light", dark: "Dark" };
function applyTheme(t) {
  const r = document.documentElement;

let speaking = false;

function toggleSpeech(root, btn) {
  if (!("speechSynthesis" in window)) { toast("Listening isn't supported in this browser."); return; }
  if (speaking) { stopSpeech(); return; }
  const parts = $$("h2, p:not(.src)", root).map((p) => p.textContent);
  speaking = true; btn.textContent = "Stop";
  let i = 0;
  const next = () => { if (!speaking || i >= parts.length) { stopSpeech(); return; } const u = new SpeechSynthesisUtterance(parts[i++]); u.rate = 0.95; u.lang = "en-US"; u.onend = next; u.onerror = () => stopSpeech(); speechSynthesis.speak(u); };
  next();
}

const REF_RE = /\b((?:[123]|I{1,3})\s?)?(Gen|Genesis|Ex|Exod|Exodus|Lev|Leviticus|Num|Numbers|Deut|Deuteronomy|Josh|Joshua|Judg|Judges|Ruth|Sam|Samuel|Kings|Kgs|Chron|Chr|Chronicles|Ezra|Neh|Nehemiah|Esth|Esther|Job|Ps|Psa|Psalm|Psalms|Prov|Proverbs|Eccl|Eccles|Ecclesiastes|Song|Cant|Isa|Isaiah|Jer|Jeremiah|Lam|Lamentations|Ezek|Ezekiel|Dan|Daniel|Hos|Hosea|Joel|Amos|Obad|Obadiah|Jonah|Mic|Micah|Nah|Nahum|Hab|Habakkuk|Zeph|Zephaniah|Hag|Haggai|Zech|Zechariah|Mal|Malachi|Matt|Mat|Matthew|Mark|Mk|Luke|Lk|John|Jn|Acts|Rom|Romans|Cor|Corinthians|Gal|Galatians|Eph|Ephesians|Phil|Philippians|Col|Colossians|Thess|Thessalonians|Tim|Timothy|Tit|Titus|Philem|Philemon|Heb|Hebrews|Jas|James|Pet|Peter|Jude|Rev|Revelation)\.?\s+(\d{1,3})(?::\s?(\d{1,3})(?:\s?[-–]\s?(\d{1,3}))?)?\b/g;

function linkRefs(html) {

/* ============ word taps ============ */
function wordAt(x, y) {
  let node, off;
  if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(x, y); if (!p) return null; node = p.offsetNode; off = p.offset; }
  else if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(x, y); if (!r) return null; node = r.startContainer; off = r.startOffset; }
  if (!node || node.nodeType !== 3) return null;
  const t = node.textContent, isW = (c) => /[A-Za-zÀ-ɏ'’-]/.test(c);
  let a = off, b = off;
  while (a > 0 && isW(t[a - 1])) a--;
  while (b < t.length && isW(t[b])) b++;
  let w = t.slice(a, b).replace(/^['’-]+|['’-]+$/g, "");
  if (!w || !/[A-Za-z]/.test(w)) return null;
  const lead = t.slice(a, b).indexOf(w);
  return { word: w, node, start: a + lead, end: a + lead + w.length };
}
function highlight(hit) {
  try { if (!window.CSS || !CSS.highlights) return; const r = new Range(); r.setStart(hit.node, hit.start); r.setEnd(hit.node, hit.end); CSS.highlights.set("tzword", new Highlight(r)); } catch (e) {}
}
function clearHighlight() { try { CSS.highlights && CSS.highlights.delete("tzword"); } catch (e) {} }
function bindText(root, ctx) {
  root.addEventListener("click", (e) => {
    const r = e.target.closest(".sref");
    if (r) { const [b, c, v1, v2] = r.dataset.ref.split("."); openRef(b, +c, v1 ? +v1 : null, v2 ? +v2 : null); return; }
    if (String(getSelection() || "").trim().length > 1) return;
    const p = e.target.closest("p[data-pi], p[data-v]"); if (!p) return;
    const hit = wordAt(e.clientX, e.clientY); if (!hit) return;
    highlight(hit);
    openWord(hit.word, { ...ctx, pi: p.dataset.pi != null ? +p.dataset.pi : null, v: p.dataset.v || null, text: p.textContent });
  });
  root.addEventListener("keydown", (e) => { const r = e.target.closest(".sref"); if (r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); r.click(); } });
}

let DIDX = null;
async function dictChunk(w) {
  if (!DIDX) DIDX = await getJSON("dict/index.json");
  let lo = 0, hi = DIDX.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (DIDX[m] <= w) lo = m; else hi = m - 1; }

}
function snippet(text, q) {
  const i = text.toLowerCase().indexOf(q); if (i < 0) return esc(text.slice(0, 160));
  const a = Math.max(0, text.lastIndexOf(" ", Math.max(0, i - 70))), b = Math.min(text.length, text.indexOf(" ", i + q.length + 90) + 1 || text.length);
  return (a > 0 ? "… " : "") + esc(text.slice(a, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length, b)) + (b < text.length ? " …" : "");
}
async function vSearch() {
  const v = $("#view"), s = S.search;
  v.innerHTML = `<section class="box pad stack" style="gap:14px"><div><h2 class="pageh">Search</h2><p class="note" style="margin-top:6px">Every word Tozer wrote here, or the whole Bible.</p></div>
    <form class="ctl" id="sf"><input type="search" id="sq" value="${esc(s.q)}" placeholder="worship, the cross, humility…" aria-label="Search text"><button class="btn primary">Search</button></form>
    <div class="seg"><button data-sc="tozer" aria-pressed="${s.scope === "tozer"}">Tozer</button><button data-sc="bible" aria-pressed="${s.scope === "bible"}">Bible (${S.bible.ver.toUpperCase()})</button></div></section>
    <section class="box" id="sres">${s.res ? s.res : `<div class="empty">Try a phrase: “prevenient grace”, “the old cross”, “worship”.</div>`}</section>`;
  $$("[data-sc]").forEach((b) => (b.onclick = () => { s.scope = b.dataset.sc; s.res = null; if (s.q) runSearch(); else vSearch(); }));
  $("#sf").onsubmit = (e) => { e.preventDefault(); s.q = $("#sq").value.trim(); if (s.q) runSearch(); };
  bindHits();
}
function bindHits() {
  $$("[data-hit]").forEach((b) => (b.onclick = () => { const [id, ch] = b.dataset.hit.split("|"); openWork(id, +ch); }));
  $$("[data-bhit]").forEach((b) => (b.onclick = () => { const [c, ch, vv] = b.dataset.bhit.split("|"); S.bible.book = c; S.bible.ch = +ch; S.bible.pick = null; S.bible.hl = +vv; show("bible"); }));
}
async function runSearch() {
  const s = S.search, q = s.q.toLowerCase(), box = $("#sres");
  box.innerHTML = `<div class="empty"><span class="spin"></span> Searching <span id="sp"></span></div>`;
  const hits = [];
  if (s.scope === "tozer") {
    const all = await loadAll((n, t) => { const sp = $("#sp"); if (sp) sp.textContent = `${n} of ${t}`; });
    for (const c of all) { const pi = c.p.findIndex((p) => p.toLowerCase().includes(q)); if (pi >= 0 || c.t.toLowerCase().includes(q)) hits.push({ c, text: c.p[Math.max(0, pi)], count: c.p.reduce((a, p) => a + (p.toLowerCase().split(q).length - 1), 0) }); }
    hits.sort((a, b) => b.count - a.count);
    s.res = hits.length ? `<div class="sechead"><span class="label">${hits.length} place${hits.length === 1 ? "" : "s"}</span></div>` + hits.slice(0, 150).map((h) => `<button class="hit" data-hit="${h.c.id}|${h.c.ch}"><small>${esc(h.c.ed ? "Editorial · " + fmtDate(h.c.d) : h.c.work)} · ${esc(h.c.t)}</small><span>${snippet(h.text.replace(/^> /, ""), q)}</span></button>`).join("") : `<div class="empty">Nothing found for “${esc(s.q)}”.</div>`;
  } else {
    const B = await bibleBooks(); let n = 0;
    for (const [code, name] of B) { const d = await chapterText(S.bible.ver, code); d.c.forEach((vs, ci) => vs.forEach((t, vi) => { if (t.toLowerCase().includes(q)) hits.push({ code, name, ch: ci + 1, v: vi + 1, t }); })); const sp = $("#sp"); if (sp) sp.textContent = `${++n} of 66 books`; if (hits.length > 600) break; }
    s.res = hits.length ? `<div class="sechead"><span class="label">${hits.length}${hits.length > 600 ? "+" : ""} verse${hits.length === 1 ? "" : "s"}</span></div>` + hits.slice(0, 200).map((h) => `<button class="hit" data-bhit="${h.code}|${h.ch}|${h.v}"><small>${esc(h.name)} ${h.ch}:${h.v}</small><span>${snippet(h.t.replace(/[\[\]]/g, ""), q)}</span></button>`).join("") : `<div class="empty">Nothing found for “${esc(s.q)}”.</div>`;
  }
  if (S.view === "search") { $("#sres").innerHTML = s.res; bindHits(); }
}

/* ============ WORDS ============ */
async function vWords() {
  const v = $("#view"), saved = L.get("saved", []), recent = L.get("recent", []), keep = L.get("keep", []), lang = defaultLang();
  v.innerHTML = `
  <section class="box pad stack" style="gap:12px"><div><h2 class="pageh">Words</h2><p class="note" style="margin-top:6px">Look up any word, or translate a passage. Tap a word while reading and it comes here too.</p></div>
    <form class="ctl" id="wf"><input type="search" id="wq" placeholder="Look up a word…" aria-label="Look up a word"><button class="btn primary">Look up</button></form></section>
  <section class="box pad stack" style="gap:12px"><div class="spread"><span class="label">Translator</span>${langSelect("tLang", lang)}</div>
    <textarea id="tIn" aria-label="Text to translate" placeholder="Paste or type English here"></textarea>
    <div class="row"><button class="btn primary" id="tGo">Translate</button>${SAMPLE ? `<button class="btn" id="tPlain">Plain English</button>` : ""}</div><div id="tOut"></div></section>
  <section class="box"><div class="sechead"><span class="label">Saved words · ${saved.length}</span></div>${saved.length ? `<div class="pad chiprow">${saved.map((x) => `<button class="chip" data-wd="${esc(x.w)}">${esc(x.w)}</button>`).join("")}</div>` : `<div class="empty">Words you save appear here.</div>`}</section>
  ${keep.length ? `<section class="box"><div class="sechead"><span class="label">Marked passages · ${keep.length}</span></div>${keep.slice(0, 50).map((k) => `<button class="hit" data-hit="${k.id}|${k.ch}"><small>${esc(k.title)}</small><span>${esc(k.text.length > 240 ? k.text.slice(0, 236) + " …" : k.text)}</span></button>`).join("")}</section>` : ""}
  ${recent.length ? `<section class="box"><div class="sechead"><span class="label">Recently looked up</span></div><div class="pad chiprow">${recent.slice(0, 30).map((x) => `<button class="chip" data-wd="${esc(x.w)}">${esc(x.w)}</button>`).join("")}</div></section>` : ""}`;
  $("#wf").onsubmit = (e) => { e.preventDefault(); const w = $("#wq").value.trim().split(/\s+/)[0]; if (w) openWord(w, null); };
  $$("[data-wd]").forEach((b) => (b.onclick = () => openWord(b.dataset.wd, null)));
  bindHits();
  $("#tLang").onchange = () => L.set("lang", $("#tLang").value);
  $("#tGo").onclick = async () => {
    const t = $("#tIn").value.trim(), l = $("#tLang").value, o = $("#tOut"); if (!t) { $("#tIn").focus(); return; }
    L.set("lang", l); o.innerHTML = `<div class="tr big"><span class="spin"></span></div>`;
    const r = await translate(t, l);
    o.innerHTML = r ? `<div class="tr big"></div><p class="note" style="margin-top:6px">${esc(langName(l))} · translated by ${esc(r.via)}.</p>` : `<p class="note">This browser can't translate on its own. <a href="${esc(gtLink(t, l))}" target="_blank" rel="noopener">Open it in Google Translate ↗</a></p>`;
    if (r) o.querySelector(".tr").textContent = r.text;
  };
  const tp = $("#tPlain"); if (tp) tp.onclick = async () => { const t = $("#tIn").value.trim(), o = $("#tOut"); if (!t) return; o.innerHTML = `<div class="tr big"><span class="spin"></span></div>`; const r = await plainEnglish(t); o.innerHTML = r ? `<div class="tr big"></div>` : `<p class="note">Couldn't reach Claude just now.</p>`; if (r) o.querySelector(".tr").textContent = r; };
}

/* ============ footer + start ============ */
$("#foot").innerHTML = `Tozer's writings here are public domain in the United States: <i>The Pursuit of God</i> (1948, not renewed), <i>Paths to Power</i> (no year in its copyright notice), and his editorials and articles in <i>The Alliance Weekly</i> and <i>The Alliance Witness</i> (1950–63, not renewed). Bible: King James Version and World English Bible. Dictionary: Webster's Unabridged (1913), WordNet 3.1 (Princeton University), Easton's Bible Dictionary (1897). Your saved words and marks stay in this browser.`;
render();

</script>
